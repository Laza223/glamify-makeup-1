name: Cron

# Dispara el job horario (carrito abandonado + autocancelación de pedidos)
# vía un simple curl autenticado a /api/cron. Reemplaza el `scheduled()` de
# Cloudflare Workers: Vercel Cron en plan Hobby permite solo 1 corrida/día,
# insuficiente para la cadencia horaria actual — GitHub Actions no tiene esa
# limitación y no depende de subir el plan de Vercel.
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/cron
        run: |
          curl -sf -X GET "${APP_URL}/api/cron" \
            -H "Authorization: Bearer ${CRON_SECRET}"
        env:
          APP_URL: ${{ vars.APP_URL || 'https://glamifymakeup.site' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
